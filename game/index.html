<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>RHL Career</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <header class="brand-header">
      <!-- TEMP TEST SHORTCUT: remove this button and its handler in app.js after testing. -->
      <button id="temporary-test-shortcut" class="brand-logo-button" type="button" aria-label="Temporary test: start a season with DRKY, Pacify, and Pegs">
        <img class="brand-logo" src="./graphics/rhl_logo/s10.png" alt="Rocket Hockey League Season 10 logo">
      </button>
      <h1 class="brand-title">Rocket Hockey League - Draft RHL S10 Simulation</h1>
    </header>

    <section id="setup-screen" aria-label="Team setup and draft">
      <div class="setup-controls">
        <div class="setup-field">
          <input id="team-name" type="text" maxlength="40" placeholder="Your Team (Enter name here)" autocomplete="off" aria-label="Your team name">
        </div>
        <div class="setup-field">
          <select id="team-select" disabled aria-label="Team to replace">
            <option value="">Team to Replace (Default is Random)</option>
          </select>
        </div>
      </div>
      <p id="setup-notice" class="notice" role="alert" hidden></p>
      <div class="draft-layout">
        <section class="draft-squad" aria-labelledby="draft-squad-title">
          <div class="draft-squad-heading">
            <div>
              <h3 id="draft-squad-title">Draft your squad</h3>
              <div id="draft-progress" class="draft-progress" aria-live="polite">0 of 3 players picked</div>
            </div>
            <button id="draft-button" type="button" disabled>Draw a random team</button>
          </div>
          <div id="draft-picked" class="draft-picked" aria-label="Your three player slots" aria-live="polite"></div>
        </section>
        <div class="reel-column">
          <section id="team-reel" class="team-reel" aria-label="Random team draw"></section>
          <button id="start-button" type="button" disabled hidden>Start the season</button>
        </div>
      </div>
      <div id="draft-players" class="player-grid" aria-live="polite"></div>
      <p id="status" class="notice visually-hidden" role="status">Loading the Season 10 player pool…</p>
    </section>

    <section id="season-screen" hidden aria-live="polite">
      <div class="season-heading">
        <div>
          <h2 id="season-title">Your season</h2>
        </div>
        <button id="advance-button" type="button">Simulate week</button>
      </div>
      <div id="champion-banner" class="champion" hidden></div>
      <div class="week-panel">
        <p id="week-description" class="week-description" hidden></p>
        <div id="week-matches" class="match-list"></div>
        <section id="bracket-panel" class="panel bracket-panel" aria-labelledby="bracket-title" hidden>
          <h2 id="bracket-title">Tournament bracket</h2>
          <p id="bracket-note" class="bracket-note"></p>
          <div id="bracket-content"></div>
        </section>
      </div>
      <div class="columns">
        <section class="panel" aria-label="League Play standings">
          <div id="standings"></div>
        </section>
      </div>
    </section>
  </main>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
